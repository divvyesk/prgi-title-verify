# What this stack does and does not give you.
#
# It brings up Postgres with the SCHEMA only. The initdb mount below applies
# data/datasets/dataset1/database/*.sql in alphabetical order — that now
# succeeds (00_extensions.sql creates pg_trgm before 02_indexes.sql needs
# gin_trgm_ops; it used to abort there), but schema is all it does:
#
#   * no titles are loaded — the 82,713-row corpus comes from
#     scripts/load_titles.py, which is not run here;
#   * title_phonetic / title_skeleton / ts_normalized are NOT created, because
#     they live in search/database/*.sql and only one directory can be mounted
#     at /docker-entrypoint-initdb.d. The phonetic retriever needs those
#     columns;
#   * STUB_MODE defaults to 1 below, so the backend serves fixtures.
#
# So `docker compose up` gives you a running, wired, EMPTY system — useful for
# checking the three services talk to each other, not for a real demo. For
# that, run scripts/bootstrap_db.sh against the database and set STUB_MODE=0.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: prgi-titleguard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prgi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../data/datasets/dataset1/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-prgi}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: prgi-titleguard-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-prgi}
      POSTGRES_DB: ${POSTGRES_DB:-prgi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PORT: ${PORT:-8000}
      STUB_MODE: ${STUB_MODE:-1}
      # Without this the container starts fine and verification works, but
      # every RAG explanation logs "LLM call failed entirely" and falls back
      # to verbatim clause text, and /v1/alternatives cannot generate. The
      # key lives in agents/.env on a dev machine, which is gitignored and
      # never reaches the image — it has to come through the environment.
      # Export it before `docker compose up`, or put it in infra/.env.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /health, not /v1/health. The health route is registered without the
      # /v1 prefix (backend/app/routers/health.py), so the old path returned
      # 404 and this container could never report healthy — which also meant
      # anything using `depends_on: condition: service_healthy` would wait
      # forever. Verified against the deployed backend: /health -> 200,
      # /v1/health -> 404.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: prgi-titleguard-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
    driver: local
